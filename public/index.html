<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ranking Atletismo</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <div class="heroText">
        <span class="eyebrow">SS. Reyes - CC. Menorca</span>
        <h1>Ranking Atletismo</h1>
      </div>
      <button id="syncBtn" class="primaryBtn">Actualizar ahora</button>
    </header>

    <section class="statusPanel" id="statusCard">
      <div>
        <span class="sectionLabel">Estado</span>
        <h2>Sincronización</h2>
      </div>
      <p id="statusText">Cargando estado...</p>
    </section>

    <section class="card filtersCard">
      <div class="cardHeader">
        <div>
          <span class="sectionLabel">Consulta</span>
          <h2>Filtros</h2>
        </div>
      </div>
      <div class="filters">
        <label>Categoría<select id="category"><option value="">Todas</option></select></label>
        <label>Prueba agrupada<select id="event"><option value="">Todas</option></select></label>
        <label>Club<select id="club"><option value="">Todos</option></select></label>
        <label>Atleta<select id="athlete"><option value="">Todos</option></select></label>
      </div>
    </section>

    <section class="card">
      <div class="cardHeader">
        <div>
          <span class="sectionLabel">Ranking</span>
          <h2>Clasificación completa por prueba</h2>
        </div>
      </div>
      <div id="ranking"></div>
    </section>

    <section class="card">
      <div class="cardHeader">
        <div>
          <span class="sectionLabel">Detalle</span>
          <h2>Resultados filtrados</h2>
        </div>
      </div>
      <div class="tableWrap">
        <table id="resultsTable">
          <thead>
            <tr><th>Categoría</th><th>Prueba</th><th>Superficie</th><th>Atleta</th><th>Club</th><th>Marca</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
