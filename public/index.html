<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ranking Atletismo U12</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <div>
        <h1>Ranking Atletismo U12</h1>
        <p>Datos cargados desde Supabase. El Excel se sincroniza automáticamente desde Google Drive.</p>
      </div>
      <button id="syncBtn">Actualizar ahora</button>
    </header>

    <section class="card" id="statusCard">
      <h2>Estado de sincronización</h2>
      <p id="statusText">Cargando estado...</p>
    </section>

    <section class="card">
      <h2>Filtros</h2>
      <div class="filters">
        <label>Categoría<select id="category"><option value="">Todas</option></select></label>
        <label>Prueba agrupada<select id="event"><option value="">Todas</option></select></label>
        <label>Club<select id="club"><option value="">Todos</option></select></label>
        <label>Atleta<select id="athlete"><option value="">Todos</option></select></label>
      </div>
    </section>

    <section class="card">
      <h2>Clasificación completa por prueba</h2>
      <div id="ranking"></div>
    </section>

    <section class="card">
      <h2>Resultados filtrados</h2>
      <div class="tableWrap"><table id="resultsTable"><thead><tr><th>Categoría</th><th>Prueba</th><th>Superficie</th><th>Atleta</th><th>Club</th><th>Marca</th></tr></thead><tbody></tbody></table></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
